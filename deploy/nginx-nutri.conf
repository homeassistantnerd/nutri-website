# NutriOpti — static SPA served on the local network.
# Listens on port 80 and only answers requests from localhost and the LAN.
# If your network is not 192.168.1.x, change the "allow" line below to match
# (e.g. 192.168.0.0/24 or 10.0.0.0/24).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/nutri;
    index index.html;

    # Restrict access to the local machine and the LAN subnet.
    allow 127.0.0.1;
    allow 192.168.1.0/24;
    deny all;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
